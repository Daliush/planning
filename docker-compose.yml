# Stack locale autonome. Copier .env.example vers .env avant le démarrage.
name: ${PLANNING_PROJECT_NAME:-planning-standalone}

services:
  planning-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PLANNING_DB_NAME:-planning}
      POSTGRES_USER: ${PLANNING_DB_USER:-planning}
      POSTGRES_PASSWORD: ${PLANNING_DB_PASSWORD:?copier .env.example vers .env et renseigner PLANNING_DB_PASSWORD}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:${PLANNING_DB_PORT:-5435}:5432"
    volumes:
      - planning-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  planning-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PLANNING_PORT: 8081
      PLANNING_DB_HOST: planning-db
      PLANNING_DB_PORT: 5432
      PLANNING_DB_NAME: ${PLANNING_DB_NAME:-planning}
      PLANNING_DB_USER: ${PLANNING_DB_USER:-planning}
      PLANNING_DB_PASSWORD: ${PLANNING_DB_PASSWORD:?renseigner PLANNING_DB_PASSWORD dans .env}
      PLANNING_CORS_ORIGINS: ${PLANNING_CORS_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:${PLANNING_PORT:-8081}:8081"
    depends_on:
      planning-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081;
          printf "GET /api/tenants HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          IFS= read -r line <&3; [[ "$$line" == *" 200 "* ]]'
      interval: 5s
      timeout: 5s
      start_period: 45s
      retries: 20

  planning-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PLANNING_FRONTEND_PORT:-5174}:80"
    depends_on:
      planning-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  planning-data:
