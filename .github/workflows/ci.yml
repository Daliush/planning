name: Planning CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  autonomy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les frontières du projet
        shell: pwsh
        run: ./scripts/check-autonomy.ps1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Tests du moteur
        working-directory: backend
        run: mvn -B --no-transfer-progress test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci
      - name: Vérifier les types et construire l'interface
        working-directory: frontend
        run: npm run build
